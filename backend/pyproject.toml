# Lint settings for the backend (run from backend/: ruff check .)
[tool.ruff]
target-version = "py311"
src = ["."]                 # backend modules import each other by bare name: treat them as first-party
extend-exclude = ["venv"]

[tool.ruff.lint]
# Pinned explicitly so results don't change when ruff's defaults do.
select = [
  "E4", "E7", "E9", "F",    # pycodestyle errors + pyflakes (undefined names, unused imports, ...)
  "I",                      # import order
  "B",                      # bugbear: likely bugs
  "UP",                     # modern syntax for the target Python
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared with calls in default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
